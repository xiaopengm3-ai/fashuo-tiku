<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>法硕真题 · 刷题台</title>
<script>
  try {
    var t = localStorage.getItem("fashuo.theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.style.colorScheme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开筛选" title="筛选">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <a class="brand" href="#" id="brandHome" aria-label="返回首页">
      <span class="brand-seal">法</span>
      <span class="brand-text">
        <strong>法硕真题</strong>
        <small>刷题台 · 2010—2026</small>
      </span>
    </a>

    <nav class="mode-switch" aria-label="题型切换">
      <button class="mode-btn is-active" data-mode="objective" aria-pressed="true">
        <span class="mode-ico">◉</span>客观题
        <em id="objCount">—</em>
      </button>
      <button class="mode-btn" data-mode="subjective" aria-pressed="false">
        <span class="mode-ico">✎</span>主观题
        <em id="subjCount">—</em>
      </button>
    </nav>

    <div class="top-actions">
      <div class="top-stat" id="topStat" title="当前题库进度">
        <span class="top-stat-num" id="doneNum">0</span>
        <span class="top-stat-label">已练</span>
        <span class="top-stat-sep">/</span>
        <span class="top-stat-total" id="totalNum">—</span>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="切换白天/黑夜模式" title="切换白天 / 黑夜">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="题库筛选">
      <div class="side-inner">
        <div class="side-section">
          <div class="side-head">
            <span>分类方式</span>
          </div>
          <div class="seg" id="groupBySeg" role="tablist">
            <button class="seg-btn is-active" data-groupby="subject" role="tab" aria-selected="true">按学科</button>
            <button class="seg-btn" data-groupby="topic" role="tab" aria-selected="false">按考点</button>
          </div>
        </div>

        <div class="side-scroll" id="sideScroll">
          <div class="side-section">
            <div class="side-head">
              <span id="treeTitle">学科</span>
              <button class="link-btn" id="clearAllBtn">清除</button>
            </div>
            <div id="tree" class="tree"></div>
          </div>

          <div class="side-section filters">
            <div class="side-head"><span>筛选</span></div>

            <label class="field">
              <span>年份</span>
              <select id="yearSelect"><option value="">全部年份</option></select>
            </label>

            <div class="field">
              <span>学位</span>
              <div class="pill-row" id="degreeRow">
                <button class="pill is-active" data-degree="">全部</button>
                <button class="pill" data-degree="非法学">非法学</button>
                <button class="pill" data-degree="法学">法学</button>
              </div>
            </div>

            <div class="field">
              <span>试卷</span>
              <div class="pill-row" id="paperRow">
                <button class="pill is-active" data-paper="">全部</button>
                <button class="pill" data-paper="基础课">专业基础</button>
                <button class="pill" data-paper="综合课">专业综合</button>
              </div>
            </div>

            <div class="field">
              <span>状态</span>
              <div class="pill-row wrap" id="statusRow">
                <button class="pill is-active" data-status="">全部</button>
                <button class="pill" data-status="todo">未做</button>
                <button class="pill" data-status="wrong">做错</button>
                <button class="pill" data-status="done">已做</button>
                <button class="pill" data-status="fav">收藏</button>
              </div>
            </div>
          </div>
        </div>

        <div class="side-foot">
          <div class="mini-progress">
            <div class="mini-progress-head">
              <span>总进度</span><span id="miniPct">0%</span>
            </div>
            <div class="bar"><i id="miniBar" style="width:0%"></i></div>
            <div class="mini-stats" id="miniStats">—</div>
          </div>
          <p class="side-note">仅在本机运行 · 进度自动保存</p>
          <a class="side-note side-link" href="mindmap/" target="_blank" rel="noopener">法制史下编 · 思维导图 →</a>
        </div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main" id="main">
      <div class="main-toolbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="tools">
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="searchInput" type="search" placeholder="搜索题干 / 选项" autocomplete="off" aria-label="搜索题干或选项">
          </div>
          <select id="sortSelect" class="select-compact" aria-label="排序">
            <option value="new">年份新→旧</option>
            <option value="old">年份旧→新</option>
            <option value="random">随机顺序</option>
          </select>
          <button class="icon-btn" id="shuffleBtn" title="打乱顺序" aria-label="打乱顺序">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l7 10h5M3 17h3l3-4M16 7h5M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
          </button>
        </div>
      </div>

      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>
</div>

<template id="tpl-dashboard">
  <div class="dashboard">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow">法律硕士 · 历年真题</p>
        <h1 id="heroTitle">把真题，<br><em>练成手感。</em></h1>
        <p class="hero-sub" id="heroSub">刑法 · 民法 · 法理学 · 宪法 · 法制史</p>
        <div class="hero-actions">
          <button class="btn primary" id="startAllBtn">开始刷题 <span class="kbd">↵</span></button>
          <button class="btn ghost" id="randomBtn">随机 20 题</button>
          <button class="btn ghost" id="wrongBookBtn">错题本</button>
        </div>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 id="panelTitle">按学科进入</h2>
          <p class="muted" id="panelSub">五大学科的客观题与主观题均已分卷整理</p>
        </div>
        <button class="link-btn" id="expandAllBtn" hidden>展开全部</button>
      </div>
      <div id="dashboardGrid" class="subject-grid"></div>
    </section>

    <section class="tips">
      <div class="tip"><b>答题</b>快捷键 A–D 选项，Enter 提交，方向键切题。</div>
      <div class="tip"><b>主题</b>右上角切换白天 / 黑夜，阅读区与选项同步适配。</div>
      <div class="tip"><b>记录</b>作答、收藏与主观题自评仅保存在浏览器本地。</div>
    </section>
  </div>
</template>

<template id="tpl-practice">
  <div class="practice">
    <div class="practice-head">
      <div class="practice-title">
        <span class="practice-kicker" id="pKicker"></span>
        <h2 id="pTitle">—</h2>
      </div>
      <div class="practice-tools">
        <span class="counter" id="pCounter">0 / 0</span>
        <button class="btn small ghost" id="jumpBtn" title="题号列表">题号</button>
        <button class="btn small ghost" id="shuffleBtn2" title="打乱">打乱</button>
      </div>
    </div>
    <div id="cardHost"></div>
    <nav class="pager" id="pager">
      <button class="btn ghost" id="prevBtn">← 上一题</button>
      <span class="pager-mid" id="pagerMid"></span>
      <button class="btn ghost" id="nextBtn">下一题 →</button>
    </nav>
  </div>
</template>

<template id="tpl-question">
  <article class="qcard" id="qcard">
    <div class="q-meta" id="qMeta"></div>
    <div class="q-material" id="qMaterial" hidden></div>
    <div class="q-stem" id="qStem"></div>
    <div class="q-options" id="qOptions"></div>
    <div class="q-subjective" id="qSubjective" hidden>
      <label class="sr-only" for="subjInput">作答</label>
      <textarea id="subjInput" class="subj-input" rows="6" placeholder="在这里写下你的答案要点，自动保存到本机…"></textarea>
      <div class="subj-meta"><span id="subjWords">0 字</span><span>可对照参考答案自评</span></div>
    </div>
    <div class="q-actions" id="qActions"></div>
    <div class="q-result" id="qResult" hidden></div>
    <div class="q-explain" id="qExplain" hidden></div>
    <footer class="q-foot">
      <div class="q-foot-left">
        <button class="chip-btn" id="favBtn" aria-pressed="false"><span class="star">☆</span> 收藏</button>
        <button class="chip-btn" id="resetBtn" hidden>重做本题</button>
      </div>
      <div class="q-foot-right">
        <button class="chip-btn" id="showAnswerBtn">显示答案</button>
      </div>
    </footer>
  </article>
</template>

<div class="modal" id="jumpModal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="题号列表">
    <div class="modal-head">
      <h3>题号</h3>
      <div class="legend"><span class="dot done"></span>已做 <span class="dot wrong"></span>做错 <span class="dot"></span>未做</div>
      <button class="icon-btn" data-close="1" aria-label="关闭">✕</button>
    </div>
    <div class="jump-grid" id="jumpGrid"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/app.js" defer></script>
</body>
</html>
